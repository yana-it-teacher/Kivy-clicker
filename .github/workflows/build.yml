name: Build Kivy APK

# Запуск сборки при пуше в ветку main (можно изменить на master)
on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запускать сборку вручную из интерфейса GitHub

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev default-jdk

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3.0.0" virtualenv wheel setuptools

      - name: Build APK with Buildozer
        # Команда yes автоматически принимает лицензионные соглашения Android SDK
        run: yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
