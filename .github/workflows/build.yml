name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          docker run --rm \
            --volume "${{ github.workspace }}:/home/user/hostcwd" \
            --workdir /home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest android debug 2>&1 | tee buildozer.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jungle-clicker-apk
          path: bin/*.apk
          if-no-files-found: error
