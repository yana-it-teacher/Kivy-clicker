name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Запускаємо весь процес одразу всередині готового контейнера
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Cache downloaded Android SDK
        uses: actions/cache@v4
        with:
          path: |
            .buildozer/android/platform
            .buildozer/android/platform/android-sdk
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/buildozer.spec') }}

      - name: Install SDK and Build APK
        run: |
          set -e
          # Приймаємо ліцензії та встановлюємо відсутні інструменти
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
            sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          fi
          # Запускаємо збірку
          buildozer android debug 2>&1 | tee buildozer.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jungle-clicker-apk
          path: bin/*.apk
          if-no-files-found: error
