name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache downloaded Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.buildozer/android/platform
            ${{ github.workspace }}/.buildozer/android/platform/android-sdk
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/buildozer.spec') }}

      - name: Build debug APK
        run: |
          set -o pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            --volume "${{ github.workspace }}:/home/user/hostcwd" \
            --workdir /home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest -lc '\
              set -e; \
              export BUILDOZER_ALLOW_ROOT=1; \
              if command -v sdkmanager >/dev/null 2>&1; then \
                yes | sdkmanager --licenses || true; \
                sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"; \
              fi; \
              buildozer android debug 2>&1 | tee buildozer.log'

      - name: Debug list workspace files
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE" || true
          echo "Find any APKs:"
          find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print || true
          echo "buildozer.log (last 200 lines):"
          tail -n 200 buildozer.log || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jungle-clicker-apk
          path: |
            **/*.apk

      - name: Upload buildozer log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buildozer-log
          path: buildozer.log
